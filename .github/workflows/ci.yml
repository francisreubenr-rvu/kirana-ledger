name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SARVAM_API_KEY: ""      # CI never uses a real key; with no key everything runs in mock mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements.txt
      - name: pytest (mock mode, no key)
        run: pytest -q
      - name: In-browser demo matches the Python parser and ledger
        run: |
          python scripts/make_js_golden.py
          git diff --exit-code tests/fixtures/js_golden.json
          node tests/js_parity.mjs
      - name: Server smoke test (mock mode)
        run: |
          KIRANA_MOCK=1 KIRANA_DB=/tmp/ci.db python -m uvicorn server.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/text -H 'Content-Type: application/json' \
            -d '{"text":"Ramesh ka 240 udhaar","speak":false}' | python -c "import sys,json; j=json.load(sys.stdin); assert j['actions'][0]['tool']=='add_credit', j"
          curl -sf -o /tmp/r.wav -X POST http://127.0.0.1:8000/voice -H 'Content-Type: audio/wav' \
            -H 'X-Mock-Transcript: Lakshmi%20300%20kottru' --data-binary 'RIFF'
          head -c 4 /tmp/r.wav | grep -q RIFF
          curl -sf http://127.0.0.1:8000/ledger | python -c "import sys,json; j=json.load(sys.stdin); assert j['customers'], j"
      - name: Static site links and assets
        run: python scripts/check_site.py
